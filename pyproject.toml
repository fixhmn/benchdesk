[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "benchdesk"
version = "0.1.0"
description = "A Windows desktop workbench for repeatable HTTP service checks"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6,<7"]

[project.scripts]
benchdesk = "benchdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["benchdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
